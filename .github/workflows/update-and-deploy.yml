name: 基準データ更新と公開

on:
  schedule:
    - cron: "0 1 * * *"   # 毎日 10:00（日本時間）。札幌市の公表日は月ごとに違うので毎日確認する
  workflow_dispatch:       # Actions 画面の「Run workflow」で手動実行
  push:
    branches: [main]       # index.html などを手で直してpushしたときも自動で版数更新＆公開

permissions:
  contents: write          # データ更新をコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pdfplumber==0.11.*" openpyxl xlrd pykakasi

      - name: 札幌市・総務省の最新データを確認して反映
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}   # Settings → Secrets and variables → Actions に登録
        run: |
          # 失敗しても、読めた分はコミットしたいので一旦続行し、最後にジョブを失敗させる
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/update_data.py || echo "UPDATE_FAILED=1" >> "$GITHUB_ENV"
          else
            python scripts/update_data.py --verify || echo "UPDATE_FAILED=1" >> "$GITHUB_ENV"
          fi

      - id: commit
        name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "基準データ/版数を自動更新"
          BR="${{ github.event.repository.default_branch }}"
          # 実行中に手動コミットが入ると push が弾かれるので、最新を取り込んでから送る
          git pull --rebase --autostash origin "$BR" || git rebase --abort || true
          git push origin "HEAD:$BR" || {
            sleep 5
            git pull --rebase --autostash origin "$BR"
            git push origin "HEAD:$BR"
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 取り込みエラーがあれば失敗にする（GitHubから通知メールが届く）
        if: env.UPDATE_FAILED == '1'
        run: |
          echo "::error::データ取り込みでエラー。上の『札幌市・総務省の最新データを確認して反映』のログを確認"
          exit 1

  deploy:
    needs: update
    # 毎日の定期実行では、データが変わった日だけ公開し直す
    if: always() && (needs.update.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # update ジョブのコミット後の最新を取る

      - name: 公開する3ファイルだけを集める
        run: |
          mkdir _site
          cp index.html manifest.json sw.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
